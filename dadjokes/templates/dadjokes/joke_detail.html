<!-- Description: template to display a single joke -->

{% extends 'dadjokes/base.html' %}
{% block content %}
<h1>Joke #{{ joke.pk }}</h1>
<p><strong>{{ joke.text }}</strong></p>
<p>-- {{ joke.name }} | {{ joke.timestamp|date:"M d, Y" }}</p>
{% endblock %}
