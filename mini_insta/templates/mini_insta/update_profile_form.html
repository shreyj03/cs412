<!-- Description: display the html form to update profile -->

<!-- mini_insta/templates/mini_insta/update_profile_form.html -->

{% extends 'mini_insta/base.html' %}
{% block content %}
<div id="create-post-form">
    <h1>Update Profile</h1>
    <form action="{% url 'update_profile' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <table>
            {{ form.as_table }}
        </table>
        <br><br>
        <input type="submit" name="submit" value="Update">
        <a href="{% url 'show_profile' profile.pk %}"><button type="button">Cancel</button></a>
    </form>
</div>
{% endblock %}
