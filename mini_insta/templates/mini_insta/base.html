<!-- Description: base HTML page to be used as template for other HTML pages -->

{% load static %}
<html>
    <head>
        <title>Mini Insta</title>
        <link rel="stylesheet" type="text/css" href="{% static 'mini_insta.css' %}">
    </head>
    <body>
        <h1>Mini Insta</h1>
        <div id="content-container">
            {% block content %}
            {% endblock %}
        </div>
    </body>
    <footer>
<!-- Tales you back to all profiles -->
    {% if profile %}
    <a href="{% url 'show_feed' profile.pk %}">🏠</a>
    <a href="{% url 'show_search' profile.pk %}">🔍</a>
    <a href="{% url 'create_post' profile.pk %}">➕</a>
    <a href="{% url 'show_profile' profile.pk %}">
        {% if profile.profile_image_url %}
        <img src="{{ profile.profile_image_url }}" class="footer-profile-img">
        {% else %}
        👤
        {% endif %}
    </a>
    {% endif %}
    <p><a href="{% url 'show_all_profiles' %}">View All Profiles</a></p>
    <p>Copyright 2026 Shrey Jain</p>
    </footer>
</html>
