<!-- Description: HTML page to search for a profile or post object -->

<!-- mini_insta/search.html 
    display the html form to search for a profile or post object
-->

{% extends 'mini_insta/base.html' %}

{% block content %}
<h1>Search</h1>

<form action="{% url 'show_search' profile.pk %}" method="get">
    Search for text, tag or people: <input type="text" name="q">
    <button type="submit">Search</button>
</form>

{% endblock %}
